name: Validate against TestGenEval

on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: "Number of instances to sample (ignored if instances is set)"
        default: "50"
      seed:
        description: "Random seed for sampling"
        default: "42"
      per_repo_cap:
        description: "Max instances taken from any single repo"
        default: "12"
      instances:
        description: "Comma-separated instance_ids to run instead of a random sample"
        default: ""
      allow_rerun:
        description: "Include previously-run instances in random sampling (true/false)"
        type: boolean
        default: false
      dataset:
        description: "HuggingFace dataset to sample from"
        type: choice
        options:
          - kjain14/testgenevallite
          - kjain14/testgeneval
        default: kjain14/testgenevallite

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[datasets]"

      - name: Run validation sample
        run: |
          if [ -n "${{ github.event.inputs.instances }}" ]; then
            PYTHONPATH=src python scripts/validate_testgeneval_sample.py \
              --instances "${{ github.event.inputs.instances }}" \
              --dataset "${{ github.event.inputs.dataset }}" \
              --output validation_results.json
          else
            PYTHONPATH=src python scripts/validate_testgeneval_sample.py \
              --sample-size "${{ github.event.inputs.sample_size }}" \
              --seed "${{ github.event.inputs.seed }}" \
              --per-repo-cap "${{ github.event.inputs.per_repo_cap }}" \
              --dataset "${{ github.event.inputs.dataset }}" \
              --output validation_results.json \
              ${{ github.event.inputs.allow_rerun == 'true' && '--allow-rerun' || '' }}
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: validation_results.json
          retention-days: 30

      - name: Commit updated validation history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/testgeneval_validation_history.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
          else
            git commit -m "chore: update testgeneval validation history (run ${{ github.run_id }})"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
